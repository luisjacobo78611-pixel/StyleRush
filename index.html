<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleRush | Ropa y Calzado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { background-color: #0f0f0f; color: #ffffff; }
    header { background: linear-gradient(90deg, #111, #222); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 28px; letter-spacing: 2px; }
    nav a { color: #ffffff; text-decoration: none; margin-left: 20px; font-weight: bold; }
    nav a:hover { color: #ff3c3c; }
    .hero { height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #000; }
    .hero h2 { font-size: 48px; margin-bottom: 15px; }
    .hero p { font-size: 20px; margin-bottom: 30px; }
    .btn { background-color: #ff3c3c; color: #fff; padding: 15px 30px; text-decoration: none; font-size: 18px; border-radius: 5px; font-weight: bold; }
    section { padding: 60px 40px; }
    .section-title { font-size: 32px; margin-bottom: 40px; text-align: center; }
    footer { background-color: #111; text-align: center; padding: 30px; margin-top: 40px; color: #aaa; }
  </style>
</head>
<body>
  <header>
    <h1>STYLERUSH</h1>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#ropa">Ropa</a>
      <a href="#calzado">Calzado</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <section class="hero" id="inicio">
    <h2>Estilo que impone</h2>
    <p>Ropa y calzado urbano con actitud</p>
    <a href="#contacto" class="btn">Comprar ahora</a>
  </section>

  <section id="contacto">
    <h2 class="section-title">Contacto</h2>
    <p style="text-align:center">Pedidos por WhatsApp o Instagram<br><strong>@stylerush.mx</strong></p>
  </section>

  <footer>
    <p>© 2026 StyleRush. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
